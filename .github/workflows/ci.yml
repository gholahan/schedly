name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run pytest
        env:
          DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
          LANGGRAPH_DB_URL: 'sqlite+aiosqlite:///:memory:'
          SECRET_KEY: 'test-secret-key-for-ci-pipeline-only'
          GOOGLE_CLIENT_ID: 'test-client-id'
          GOOGLE_CLIENT_SECRET: 'test-client-secret'
          GOOGLE_REDIRECT_URI: 'http://localhost:8000/calendar/google/callback'
          GOOGLE_TOKEN_ENCRYPTION_KEY: '0000000000000000000000000000000000000000000='
          OPENROUTER_API_KEY: 'test-openrouter-api-key'
        run: |
          pytest -v

  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test
